{{define "title"}}{{t "mfa.title"}}{{end}}
{{define "content"}}<div class="card narrow">
  <h1>{{t "mfa.title"}}</h1>
  <p>{{t "mfa.intro"}}</p>
  {{template "error-alert" .D.Error}}
  <form method="post" action="/signin/2fa" autocomplete="off">
    {{template "csrf" .}}
    <div class="field">
      <label for="code">{{t "mfa.code"}}</label>
      <input id="code" name="code" type="text" inputmode="text" autocomplete="one-time-code" autocapitalize="none" spellcheck="false" required maxlength="16" data-e2e="mfa-input-code">
      <span class="hint">{{t "mfa.code_hint"}}</span>
    </div>
    <button class="btn btn-primary btn-block" type="submit" data-e2e="mfa-btn-submit">{{t "mfa.submit"}}</button>
  </form>
  <form method="post" action="/signout" class="actions">{{template "csrf" .}}<button class="btn btn-block" type="submit" data-e2e="mfa-btn-cancel">{{t "form.cancel"}}</button></form>
</div>{{end}}
