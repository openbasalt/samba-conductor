{{define "title"}}{{t "me.change_password"}}{{end}}
{{define "content"}}<div class="card narrow">
  <h1>{{t "me.change_password"}}</h1>
  {{template "error-alert" .D.Error}}
  <form method="post" action="/me/password">
    {{template "csrf" .}}
    <div class="field">
      <label for="current">{{t "password.current"}}</label>
      <input id="current" name="current" type="password" autocomplete="current-password" required data-e2e="me-password-input-current">
    </div>
    <div class="field">
      <label for="new">{{t "password.new"}}</label>
      <input id="new" name="new" type="password" autocomplete="new-password" required data-e2e="me-password-input-new">
      <span class="hint">{{t "password.policy_hint"}}</span>
    </div>
    <div class="field">
      <label for="confirm">{{t "password.confirm"}}</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" required data-e2e="me-password-input-confirm">
    </div>
    <div class="actions">
      <button class="btn btn-primary" type="submit" data-e2e="me-password-btn-submit">{{t "password.submit"}}</button>
      <a class="btn" href="/me" data-e2e="me-password-link-cancel">{{t "form.cancel"}}</a>
    </div>
  </form>
</div>{{end}}
