{{define "title"}}{{t "recovery.title"}}{{end}}
{{define "content"}}<div class="card narrow">
  <h1>{{t "recovery.title"}}</h1>
  <div class="alert-warn" role="alert">{{t "recovery.warn"}}</div>
  <ul class="codes" data-e2e="recovery-list-codes">{{range .D.Codes}}<li data-e2e="recovery-text-code">{{.}}</li>{{end}}</ul>
  <div class="actions"><a class="btn btn-primary btn-block" href="{{.D.Next}}" data-e2e="recovery-link-continue">{{t "recovery.continue"}}</a></div>
</div>{{end}}
