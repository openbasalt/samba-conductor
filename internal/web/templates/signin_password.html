{{define "title"}}{{t "signin.password.title"}}{{end}}
{{define "content"}}<div class="card narrow">
  <h1>{{t "signin.password.title"}}</h1>
  <p data-e2e="signin-password-text-intro">{{t "signin.password.intro" .D.Username}}</p>
  {{template "error-alert" .D.Error}}
  <form method="post" action="/signin/password">
    {{template "csrf" .}}
    <input type="text" name="username" value="{{.D.Username}}" autocomplete="username" hidden>
    <div class="field">
      <label for="current">{{t "password.current"}}</label>
      <input id="current" name="current" type="password" autocomplete="current-password" required data-e2e="signin-password-input-current">
    </div>
    <div class="field">
      <label for="new">{{t "password.new"}}</label>
      <input id="new" name="new" type="password" autocomplete="new-password" required data-e2e="signin-password-input-new">
      <span class="hint">{{t "password.policy_hint"}}</span>
    </div>
    <div class="field">
      <label for="confirm">{{t "password.confirm"}}</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" required data-e2e="signin-password-input-confirm">
    </div>
    <button class="btn btn-primary btn-block" type="submit" data-e2e="signin-password-btn-submit">{{t "password.submit"}}</button>
  </form>
  <form method="post" action="/signout" class="actions">{{template "csrf" .}}<button class="btn btn-block" type="submit" data-e2e="signin-password-btn-cancel">{{t "form.cancel"}}</button></form>
</div>{{end}}
