# nfpm configuration of the "conductor" package (conductor + conductor-helper),
# one file for the .deb and the .rpm. Built by packaging/build.sh, which sets
# ARCH, PKG_VERSION, PKG_REVISION, BUILD (staging directory) and
# SOURCE_DATE_EPOCH (every timestamp). Paths are relative to the repository
# root. Entries marked "packager: deb" or "packager: rpm" exist in one format
# only (Debian keeps docs and licenses in /usr/share/doc and sets modes in
# postinst; Fedora keeps licenses in /usr/share/licenses and owns its
# directories in the payload).
name: conductor
arch: ${ARCH}
platform: linux
version: ${PKG_VERSION}
version_schema: none
release: ${PKG_REVISION}
section: admin
priority: optional
maintainer: Samba Conductor maintainers <samba-conductor@openbasalt.org>
vendor: OpenBasalt
homepage: https://github.com/openbasalt/samba-conductor
license: Apache-2.0
description: |-
  web administrator and self-service portal for Samba AD
  Samba Conductor manages a Samba Active Directory domain from the browser:
  users, groups, OUs, computers, DNS, Group Policy links, password policies,
  lockouts and bulk operations, plus a self-service portal for every user.
  Every change uses the signed-in user's own Kerberos identity, is previewed
  before it is applied and is recorded in a hash-chained audit log;
  administrators need a second factor.
  .
  This package also contains conductor-helper, the small privileged service
  that runs the few samba-tool operations that need root on the domain
  controller. Nothing is started at installation: run "conductor setup"
  first (see the README in /usr/share/doc/conductor).

depends:
  - systemd | systemd-standalone-sysusers | systemd-sysusers
recommends:
  - samba-ad-dc (>= 2:4.19)
suggests:
  - conductor-backup
  - conductor-sync

rpm:
  summary: Web administrator and self-service portal for Samba AD
  group: Applications/System
  buildhost: build.samba-conductor.openbasalt.org
  compression: zstd

overrides:
  deb:
    scripts:
      postinstall: packaging/scripts/postinst
      preremove: packaging/scripts/prerm
      postremove: packaging/scripts/postrm
  rpm:
    depends:
      - systemd
      # The SELinux policy wherever the targeted policy is installed
      # (Fedora, Basalt OS): installed first, so the files get their labels;
      # the same version, so an upgrade of the package upgrades its policy.
      - (conductor-selinux = ${PKG_VERSION}-${PKG_REVISION} if selinux-policy-targeted)
    recommends:
      - samba-dc
    suggests:
      - conductor-backup
      - conductor-sync
    scripts:
      preinstall: packaging/rpm/pre
      postinstall: packaging/rpm/post
      preremove: packaging/rpm/preun
      postremove: packaging/rpm/postun

contents:
  - expand: true
    src: ${BUILD}/bin/conductor
    dst: /usr/bin/conductor
    file_info: {mode: 0755}
  - expand: true
    src: ${BUILD}/bin/conductor-helper
    dst: /usr/bin/conductor-helper
    file_info: {mode: 0755}

  - expand: true
    src: ${BUILD}/systemd/conductor.service
    dst: /usr/lib/systemd/system/conductor.service
    file_info: {mode: 0644}
  - expand: true
    src: ${BUILD}/systemd/conductor-helper.service
    dst: /usr/lib/systemd/system/conductor-helper.service
    file_info: {mode: 0644}
  - src: packaging/sysusers.conf
    dst: /usr/lib/sysusers.d/conductor.conf
    file_info: {mode: 0644}

  # Configuration. Debian: modes from postinst (dpkg-statoverride).
  - src: packaging/helper.toml
    dst: /etc/conductor/helper.toml
    type: config|noreplace
    packager: deb
    file_info: {mode: 0644}
  # Fedora: the package owns its directories with their final modes.
  - dst: /etc/conductor
    type: dir
    packager: rpm
    file_info: {mode: 0750, owner: root, group: conductor}
  - src: packaging/helper.toml
    dst: /etc/conductor/helper.toml
    type: config|noreplace
    packager: rpm
    file_info: {mode: 0640, owner: root, group: conductor}
  - dst: /etc/conductor/tls
    type: dir
    packager: rpm
    file_info: {mode: 0750, owner: root, group: conductor}
  - dst: /etc/conductor/credentials
    type: dir
    packager: rpm
    file_info: {mode: 0700, owner: root, group: root}
  - dst: /var/lib/conductor
    type: dir
    packager: rpm
    file_info: {mode: 0700, owner: conductor, group: conductor}

  # A plain file in the .deb, a documentation file (%doc) in the .rpm.
  - expand: true
    src: ${BUILD}/man/conductor.8.gz
    dst: /usr/share/man/man8/conductor.8.gz
    packager: deb
    file_info: {mode: 0644}
  - expand: true
    src: ${BUILD}/man/conductor.8.gz
    dst: /usr/share/man/man8/conductor.8.gz
    type: doc
    packager: rpm
    file_info: {mode: 0644}
  # A plain file in the .deb, a documentation file (%doc) in the .rpm.
  - expand: true
    src: ${BUILD}/man/conductor-helper.8.gz
    dst: /usr/share/man/man8/conductor-helper.8.gz
    packager: deb
    file_info: {mode: 0644}
  - expand: true
    src: ${BUILD}/man/conductor-helper.8.gz
    dst: /usr/share/man/man8/conductor-helper.8.gz
    type: doc
    packager: rpm
    file_info: {mode: 0644}
  # A plain file in the .deb, a documentation file (%doc) in the .rpm.
  - src: conductor.toml.example
    dst: /usr/share/doc/conductor/examples/conductor.toml
    packager: deb
    file_info: {mode: 0644}
  - src: conductor.toml.example
    dst: /usr/share/doc/conductor/examples/conductor.toml
    type: doc
    packager: rpm
    file_info: {mode: 0644}

  # Debian documentation and licenses.
  - src: packaging/copyright
    dst: /usr/share/doc/conductor/copyright
    packager: deb
    file_info: {mode: 0644}
  - src: NOTICE
    dst: /usr/share/doc/conductor/NOTICE
    packager: deb
    file_info: {mode: 0644}
  - expand: true
    src: ${BUILD}/doc/conductor/THIRD-PARTY-LICENSES.gz
    dst: /usr/share/doc/conductor/THIRD-PARTY-LICENSES.gz
    packager: deb
    file_info: {mode: 0644}
  - expand: true
    src: ${BUILD}/doc/conductor/changelog.Debian.gz
    dst: /usr/share/doc/conductor/changelog.Debian.gz
    packager: deb
    file_info: {mode: 0644}
  - src: packaging/README.Debian
    dst: /usr/share/doc/conductor/README.Debian
    packager: deb
    file_info: {mode: 0644}
  - src: packaging/lintian-overrides
    dst: /usr/share/lintian/overrides/conductor
    packager: deb
    file_info: {mode: 0644}

  # Fedora documentation and licenses (%license, %doc), in directories the
  # package owns (removed with it).
  - dst: /usr/share/doc/conductor
    type: dir
    packager: rpm
    file_info: {mode: 0755}
  - dst: /usr/share/doc/conductor/examples
    type: dir
    packager: rpm
    file_info: {mode: 0755}
  - dst: /usr/share/licenses/conductor
    type: dir
    packager: rpm
    file_info: {mode: 0755}
  - src: LICENSE
    dst: /usr/share/licenses/conductor/LICENSE
    type: license
    packager: rpm
    file_info: {mode: 0644}
  - src: NOTICE
    dst: /usr/share/licenses/conductor/NOTICE
    type: license
    packager: rpm
    file_info: {mode: 0644}
  - expand: true
    src: ${BUILD}/doc/conductor/THIRD-PARTY-LICENSES
    dst: /usr/share/licenses/conductor/THIRD-PARTY-LICENSES
    type: license
    packager: rpm
    file_info: {mode: 0644}
  - src: packaging/rpm/README.Fedora
    dst: /usr/share/doc/conductor/README.Fedora
    type: doc
    packager: rpm
    file_info: {mode: 0644}
